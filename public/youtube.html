<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload de Vídeos - YouTube</title>
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    rel="stylesheet"
  />
  <style>
    /* Fundo com animação */
    body {
      margin: 0;
      padding: 0;
      background-image: url('fundo.jpg');
      background-size: 110%;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      animation: moveBackground 40s ease-in-out infinite alternate;
      color: #fff;
    }

    @keyframes moveBackground {
      0% {
        background-position: center;
        background-size: 110%;
      }
      50% {
        background-position: top left;
        background-size: 115%;
      }
      100% {
        background-position: bottom right;
        background-size: 110%;
      }
    }

    /* Cabeçalho */
    header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    header .logo {
      display: flex;
      align-items: center;
    }

    header .logo img {
      width: 40px;
      height: 40px;
      margin-right: 12px;
    }

    header .logo h1 {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header .search-bar {
      display: flex;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      padding: 6px 12px;
      width: 400px;
      backdrop-filter: blur(6px);
    }

    header .search-bar input {
      width: 85%;
      padding: 8px 12px;
      border: none;
      border-radius: 30px;
      background-color: transparent;
      color: #fff;
      font-size: 16px;
    }

    header .search-bar button {
      background: #ffffff10;
      border: none;
      border-radius: 50%;
      padding: 10px;
      color: #fff;
      cursor: pointer;
    }

    .main-container {
      display: flex;
      margin-top: 20px;
      padding: 0 16px;
      height: calc(100vh - 80px);
    }

    .sidebar {
      width: 240px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      margin-top: 20px;
    }

    .sidebar h2 {
      color: #fff;
      font-size: 20px;
      margin-bottom: 16px;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li {
      padding: 10px;
      margin-bottom: 8px;
      background-color: transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
      color: #ddd;
    }

    .sidebar ul li:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .sidebar ul li i {
      margin-right: 10px;
    }

    .content {
      flex-grow: 1;
      padding: 0 24px;
      overflow-y: auto;
    }

    .upload-form {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      margin-top: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      color: #fff;
      text-align: center;
    }

    .upload-form h3 {
      color: #ffffff;
      margin-bottom: 20px;
    }

    .upload-form input[type="file"] {
      padding: 14px;
      width: 100%;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 10px;
      color: #fff;
    }

    .upload-form button {
      padding: 14px 24px;
      border: none;
      width: 100%;
      background: linear-gradient(to right, #000000, #434343);
      color: white;
      font-weight: bold;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .upload-form button:hover {
      background: linear-gradient(to right, #434343, #000000);
    }

    #btn-logout {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(to right, #000000, #434343);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #btn-logout:hover {
      background: linear-gradient(to right, #434343, #000000);
    }

    .video-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }

    .video-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .video-card video {
      width: 100%;
      height: auto;
    }

    .video-card .info {
      padding: 16px;
      color: #fff;
    }

    .video-card .info h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .video-card .info .views {
      font-size: 14px;
      color: #ccc;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        margin-bottom: 20px;
      }

      header .search-bar {
        width: 60%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png"
        alt="YouTube Logo"
      />
      <h1>Youtube</h1>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar" />
      <button>🔍</button>
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <h2>Categorias</h2>
      <ul>
        <li><i class="fas fa-home"></i> Início</li>
        <li><i class="fas fa-compass"></i> Explorar</li>
        <li><i class="fas fa-bell"></i> Inscrições</li>
        <li><i class="fas fa-bookmark"></i> Biblioteca</li>
      </ul>
    </div>

    <div class="content">
      <!-- Botão Voltar para Login -->
      <button id="btn-logout">Voltar para Login</button>

      <!-- Formulário de Upload -->
      <div class="upload-form">
        <h3>Enviar Vídeo</h3>
        <form action="/upload" method="POST" enctype="multipart/form-data">
          <input type="file" name="video" id="video" accept="video/*" required />
          <button type="submit">Enviar Vídeo</button>
        </form>
      </div>

      <h3>Vídeos Enviados</h3>
      <div class="video-list" id="videolist"></div>
    </div>
  </div>

  <!-- Botão do chat -->
  <button id="chat-toggle" style="
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #ff0000;
    border: none;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    color: white;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 1000;
  ">
    💬
  </button>

  <!-- Caixa do chat -->
  <div id="chat-box" style="
    display: none;
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 320px;
    max-height: 400px;
    background: rgba(0,0,0,0.8);
    color: white;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    padding: 12px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
  ">
    <div style="flex-grow: 1; overflow-y: auto; margin-bottom: 10px;" id="chat-messages">
      <p><em>Chat interno iniciado.</em></p>
    </div>
    <input
      id="chat-input"
      type="text"
      placeholder="Digite sua mensagem..."
      style="padding: 8px; border-radius: 6px; border: none; outline: none;"
    />
    <button id="chat-send" style="
      margin-top: 8px;
      padding: 8px;
      background: #ff0000;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    ">Enviar</button>
  </div>

  <script>
    
    // Botão Voltar para Login redireciona para logout
    document.getElementById('btn-logout').addEventListener('click', () => {
      window.location.href = '/logout';
    });

    // Carregar vídeos da API
    fetch('/videos')
      .then((response) => response.json())
      .then((data) => {
        const videolist = document.getElementById('videolist');
        if (data.length === 0) {
          videolist.innerHTML = '<p>Nenhum vídeo enviado ainda.</p>';
          return;
        }

        data.forEach((video) => {
          const videoCard = document.createElement('div');
          videoCard.classList.add('video-card');
          videoCard.innerHTML = `
            <video controls>
              <source src="/uploads/${video.filename}" type="video/mp4" />
              Seu navegador não suporta o elemento vídeo.
            </video>
            <div class="info">
              <h3>${video.filename}</h3>
              <p class="views">Visualizações: 10 mil</p>
            </div>
          `;
          videolist.appendChild(videoCard);
        });
      });

    // Chat interno
    const chatToggleBtn = document.getElementById('chat-toggle');
    const chatBox = document.getElementById('chat-box');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send');

    // Abre/fecha o chat ao clicar no botão
    chatToggleBtn.addEventListener('click', () => {
      if (chatBox.style.display === 'none' || chatBox.style.display === '') {
        chatBox.style.display = 'flex';
        chatInput.focus();
      } else {
        chatBox.style.display = 'none';
      }
    });

    // Envia mensagem e limpa input (simples, sem backend)
    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      // Cria mensagem do usuário
      const msgUser = document.createElement('p');
      msgUser.style.textAlign = 'right';
      msgUser.style.margin = '6px 0';
      msgUser.textContent = text;
      chatMessages.appendChild(msgUser);

      // Resposta automática do bot (exemplo)
      const msgBot = document.createElement('p');
      msgBot.style.textAlign = 'left';
      msgBot.style.margin = '6px 0';
      msgBot.style.color = '#ff6666';
      msgBot.textContent = 'Bot: Recebi sua mensagem!';
      chatMessages.appendChild(msgBot);

      chatInput.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatSendBtn.addEventListener('click', sendMessage);

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
